<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Janela - Java Script</title>
</head>
<body onresize="acao()">
    <script>
        function acao(){
            alert('Ação Iniciada');
        }
    </script>

    <!--
    onresize – quando a página é redimensionada.
    onscroll – quando o scroll no mouse é acionado.
    -->
</body>
</html>
