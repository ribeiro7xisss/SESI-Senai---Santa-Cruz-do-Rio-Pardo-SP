<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada e Saída - Java Script </title>
    <script>
        function selecionarCaracter(){
            var caracter = document.getElementById('entrada').value 
            document.getElementById('saida').value = caracter
        }
    </script>
</head>
<body>
    <label> Entrada </label>
    <input type="text" id="entrada" onkeyup="selecionarCaracter()" placeholder="Digite o caracter">

    <br><br>

    <label>Saída</label>
    <input type="texto" id="saida" disabled="disabled">
</body>
</html>
