<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Teclado - Java Script</title>
</head>
<body>
    <script>
        function acao(){
            alert('Ação Iniciada');
        }
    </script>
    <input onkeydown="acao()" type="text"/>

    <!--
    onkeydown – quando uma tecla é pressionada.
    onkeypress – quando eu mantenho a tecla pressio nada. (somente caracteres)
    onkeyup – quando a tecla é liberada.
    -->
</body>
</html>
