<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios 09 - Java Script</title>
</head>
<body>
    <script>
        function CalcularMedia(km, litro){
            var media = km / litro
            document.write('MÉDIA: ' + Math.ceil(media) );
        }

    CalcularMedia(prompt('Digite o KM; '), prompt('Digite o L: '));
    </script>
</body>
