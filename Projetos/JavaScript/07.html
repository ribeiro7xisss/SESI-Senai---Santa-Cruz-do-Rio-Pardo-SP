<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios 07 - Java Script</title>
</head>
<body>
    <script>
        // 
            function verificarParImpar (numero){
                if (numero % 2 === 0 ){
                    document.write('Par');
                } else {
                        document.write ('Impar')
                    }            
            }

            verificarParImpar(prompt('Informe o valor '));
        // 
            function CalcularParImpar(numero) {
                if (numero % 2 === 0) {
                    return 'Par';
                } else {
                    return 'Impar'
                }
            }
            var resultado = CalcularParImpar(parseInt(prompt('Digite um número: ')));
            document.write(resultado);
    </script>
</body>
</html>
