<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Mouse - Java Script</title>
</head>
<body>
    <script>
        function acao(){
            alert('Ação Iniciada');
        }
    </script>
    <div onclick="acao()" style="background-color: black; height: 200px; width: 200px;"></div>

    <!--
    onclick – evento quando o elemento é clicado.
    ondblclick - evento quando o elemento é clica d o duas vezes.
    onmouseup - evento quando o elemento é clicado é liberado.
    onmouseover - evento quando o cursor do mouse posiciona sobre o elemento.
    onmouseout – evento quando o cursos sai da área do elemento.
    -->
</body>
</html>
