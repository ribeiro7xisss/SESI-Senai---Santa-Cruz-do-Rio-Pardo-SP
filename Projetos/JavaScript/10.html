<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercícios 10 - Java Script</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="m-3 p-3">
        <label for="exampleDataList" class="form-label">Escolha seu valor</label>
        <input class="form-control" list="datalistOptions" id="exampleDataList" placeholder="Type to search...">
        <datalist id="datalistOptions">
            <option value="1">
            <option value="2">
            <option value="3">
            <option value="4">
            <option value="5">
        </datalist>
        <br>
        <button onclick="acao()" type="button" class="btn btn-primary btn-sm">Enviar</button>
    </div>

    <script>
        function acao() {
            alert('Ação Iniciada');
        }
    </script>
</body>

</html>
