name: Organizar projetos

on:
  push:
    paths:
      - ".github/workflows/organizar-projetos.yml"

permissions:
  contents: write

jobs:
  copiar-projetos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar projetos originais
        run: |
          mkdir -p "$RUNNER_TEMP/projetos"
          git clone --depth 1 https://github.com/ribeiro7xisss/Exercicios-CSS.git "$RUNNER_TEMP/projetos/css"
          git clone --depth 1 https://github.com/ribeiro7xisss/Prejeto-Integrador.git "$RUNNER_TEMP/projetos/integrador"
          git clone --depth 1 https://github.com/ribeiro7xisss/Exercicios-HTML.git "$RUNNER_TEMP/projetos/html"
          git clone --depth 1 https://github.com/ribeiro7xisss/Exercicios-BOOTSTRAP.git "$RUNNER_TEMP/projetos/bootstrap"
          git clone --depth 1 https://github.com/ribeiro7xisss/JavaScript.git "$RUNNER_TEMP/projetos/javascript"
          git clone --depth 1 https://github.com/ribeiro7xisss/AcademyShop-28.08.git "$RUNNER_TEMP/projetos/academy-shop"

      - name: Copiar para pastas organizadas
        run: |
          mkdir -p Projetos/{CSS,Projeto-Integrador,HTML,Bootstrap,JavaScript,Academy-Shop}
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/css/" Projetos/CSS/
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/integrador/" Projetos/Projeto-Integrador/
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/html/" Projetos/HTML/
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/bootstrap/" Projetos/Bootstrap/
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/javascript/" Projetos/JavaScript/
          rsync -a --exclude=.git "$RUNNER_TEMP/projetos/academy-shop/" Projetos/Academy-Shop/

      - name: Salvar organização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Projetos
          git commit -m "Adiciona projetos organizados em pastas separadas"
          git push
